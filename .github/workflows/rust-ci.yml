name: Rust CI

on:
  push:
    branches: [main, feat/outbox-connector]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arche-omega-relayer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check
      - name: cargo test
        run: cargo test

  mock-accelerator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: mock acceleration test
        run: python -m unittest discover -s Core/tests -p "test_*.py"

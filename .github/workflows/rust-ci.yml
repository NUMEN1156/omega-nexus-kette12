name: Rust CI

on:
  push:
    branches: [main, feat/outbox-connector]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arche-omega-relayer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check
      - name: cargo test
        run: cargo test

  anvil-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: forge test (l1-contracts)
        run: forge test -vv
        working-directory: l1-contracts
      - name: anvil e2e (node -> deploy -> relay -> timelock advance -> event catch)
        run: ./scripts/anvil-e2e.sh

  mock-accelerator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: mock acceleration test
        run: python -m unittest discover -s Core/tests -p "test_*.py"

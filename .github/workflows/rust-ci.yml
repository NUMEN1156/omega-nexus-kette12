name: Rust CI



on:

  push:
  
    branches: [main, feat/relay-security]
    
  pull_request:
  


jobs:

  check:
  
    runs-on: ubuntu-latest
    
    defaults:
    
      run:
      
        working-directory: arche-omega-relayer
        
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
        with:
        
          components: rustfmt
          
      - name: cargo fmt
      
        run: cargo fmt --all
        
      - name: cargo check
      
        run: cargo check
        
      - name: cargo test
      
        run: cargo test
        




















name: GitHub Agent Actions Ops

on:
  workflow_run:
    # `workflow_run` requires an explicit workflow name list; without it the
    # whole workflow file is invalid and every run fails with 0 jobs.
    workflows:
      - GitHub Agent Conflict Resolver
      - GitHub Agent Dependency Audit
      - GitHub Agent Health
      - GitHub Agent Issue Triage
      - GitHub Agent Orchestrator
      - GitHub Agent PR Review
      - GitHub Agent Release Draft
      - GitHub Agent Security Audit
      - GitHub Agent Semantic Review
      - GitHub Agent Stale Maintenance
      - GitHub Agent Test
      - KETTE12 Compliance Gate & SLSA-L4 Verification
      - Rust CI
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Record failed workflow facts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${RUN_ID:-}" ]]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/actions-failure.log || true
          else
            gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json name,status,conclusion,headBranch > /tmp/actions-failure.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: actions-ops-${{ github.run_id }}
          path: /tmp/actions-failure.log

name: GitHub Agent Dependency Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/requirements*.txt', '**/package*.json']

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Python dependency audit when requirements exist
        run: |
          mapfile -d '' requirements_files < <(find . -type f -name 'requirements*.txt' -not -path './.git/*' -print0)
          if (( ${#requirements_files[@]} > 0 )); then
            python -m pip install pip-audit
            for requirements_file in "${requirements_files[@]}"; do
              pip-audit -r "$requirements_file" || true
            done
          else
            echo 'No Python requirements files; Rust audit completed.'
          fi

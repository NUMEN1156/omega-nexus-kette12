name: GitHub Agent Dependency Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/requirements*.txt', '**/package*.json']

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --workspace
      - name: Python dependency audit when requirements exist
        run: |
          if compgen -G '**/requirements*.txt' >/dev/null; then
            python -m pip install pip-audit
            pip-audit -r requirements.txt || true
          else
            echo 'No root requirements file; Rust audit completed.'
          fi

openapi: 3.1.0
info:
  title: NEXUS_11 Verification & Compliance API
  version: 0.6.0
  description: |
    API-Verträge für den autoritativen Kern, das KETTE12 Verification Gate und
    die read-only Bereitstellung verifizierter Audit-Evidenz.
servers:
  - url: https://api.nexus11.local/v0.6
    description: Verifizierte Compliance-Umgebung
tags:
  - name: Core
  - name: Verification
  - name: Audit
paths:
  /core/canonicalize:
    post:
      tags: [Core]
      summary: Kanonisiert JSON strikt gemäß RFC 8785 (JCS)
      operationId: canonicalizePayload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalizeRequest'
      responses:
        '200':
          description: Kanonische Byte-Repräsentation und Digest erzeugt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /core/validate:
    post:
      tags: [Core]
      summary: Validiert einen Zustandsübergang mit autoritativer Operationseinstufung
      operationId: validateTransition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Ergebnis der ReadOnly-, Mutating- oder Privileged-Prüfung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /verification/runs:
    post:
      tags: [Verification]
      summary: Startet eine vollständige KETTE12-Live-Validierung
      operationId: createVerificationRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRunRequest'
      responses:
        '202':
          description: Validierung angenommen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'

  /verification/runs/{runId}:
    get:
      tags: [Verification]
      summary: Liefert Status, Digest-Korrelation und Gate-Entscheidung
      operationId: getVerificationRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Verifikationsstatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit/reports/{reportId}:
    get:
      tags: [Audit]
      summary: Liefert ein bereits verifiziertes read-only report.json-Artefakt
      operationId: getAuditReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Verifizierter Audit-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit/reports/{reportId}/fixtures/mutated:
    get:
      tags: [Audit]
      summary: Liefert die absichtlich mutierte Fixture zum Fail-Safe-Nachweis
      operationId: getMutatedFixtureResult
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Mutationsvergleich gegen die Happy-Path-Evidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutatedFixtureResult'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Nicht autorisierte privilegierte Operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Integritäts- oder Evidenzprüfung fehlgeschlagen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    CanonicalizeRequest:
      type: object
      required: [payload]
      properties:
        payload:
          description: JSON-Objekt vor JCS-Kanonisierung
          type: object
          additionalProperties: true

    CanonicalizeResponse:
      type: object
      required: [canonical_json, subject_digest, canonicalization]
      properties:
        canonicalization:
          type: string
          const: RFC8785-JCS
        canonical_json:
          type: string
        subject_digest:
          type: string
          description: BLAKE3- oder kompatibler Subject Digest über die kanonische Darstellung
        signature_ready:
          type: boolean
          default: true

    ValidateRequest:
      type: object
      required: [operation, actor, payload]
      properties:
        operation:
          type: string
          enum: [Validate, DeriveState, Canonicalize, Audit, Commit, Publish, Export, MutateState]
        actor:
          type: string
        payload:
          type: object
          additionalProperties: true
        evidence_required:
          type: boolean
          default: false

    ValidateResponse:
      type: object
      required: [operation, classification, allowed, deterministic]
      properties:
        operation:
          type: string
        classification:
          type: string
          enum: [ReadOnly, Mutating, Privileged]
        allowed:
          type: boolean
        deterministic:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        evidence_checks:
          type: array
          items:
            type: string

    CreateVerificationRunRequest:
      type: object
      required:
        - commit_sha
        - branch
        - artifact_digest
        - provenance_subject_digest
        - oidc_identity
        - live_validation_approved
        - scope
      properties:
        commit_sha:
          type: string
        branch:
          type: string
        artifact_digest:
          type: string
        provenance_subject_digest:
          type: string
        rekor_entry_uuid:
          type: string
        oidc_identity:
          type: string
        live_validation_approved:
          type: boolean
          const: true
        scope:
          type: string
          const: all

    VerificationRunAccepted:
      type: object
      required: [run_id, status, verifier]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        verifier:
          type: string
          const: kette12-verify.sh

    VerificationRunStatus:
      type: object
      required: [run_id, status, gate_decision, checks]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, passed, failed]
        gate_decision:
          type: string
          enum: [pass, fail]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/VerificationCheck'
        report_id:
          type: string
        archived_artifacts:
          type: array
          items:
            type: string

    VerificationCheck:
      type: object
      required: [name, passed]
      properties:
        name:
          type: string
          enum:
            - git_integrity
            - provenance_matching
            - rekor_inclusion
            - oidc_validity
            - zero_error_exit
        passed:
          type: boolean
        detail:
          type: string

    AuditReport:
      type: object
      required: [report_id, generated_at, status, evidence, archive]
      properties:
        report_id:
          type: string
        generated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [verified]
        evidence:
          type: object
          required: [commit_sha, artifact_digest, provenance_subject_digest, blake3_root, signature_scheme]
          properties:
            commit_sha:
              type: string
            artifact_digest:
              type: string
            provenance_subject_digest:
              type: string
            blake3_root:
              type: string
            signature_scheme:
              type: string
              enum: [Ed25519]
        archive:
          type: object
          required: [mode, files]
          properties:
            mode:
              type: string
              const: WORM
            files:
              type: array
              items:
                type: string
                enum:
                  - vault_manifest.json
                  - blake3_root.json
                  - state_export.json
                  - ledger.jsonl
                  - sig_meta.json
                  - vault/export/

    MutatedFixtureResult:
      type: object
      required: [report_id, mutation_applied, happy_path_valid, mutated_valid]
      properties:
        report_id:
          type: string
        mutation_applied:
          type: string
          example: single-byte vault change
        happy_path_valid:
          type: boolean
          const: true
        mutated_valid:
          type: boolean
          const: false
        failure_reason:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
